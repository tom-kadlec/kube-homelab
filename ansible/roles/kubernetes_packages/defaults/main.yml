---
# Derived from k8s_version / k8s_version_short in group_vars when unset
kubernetes_apt_release_key_url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version_short }}/deb/Release.key"
kubernetes_apt_repository: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_version_short }}/deb/ /"
kubernetes_keyring_path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
kubernetes_list_path: /etc/apt/sources.list.d/kubernetes.list
kubernetes_hold_packages: true
