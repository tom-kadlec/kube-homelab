---
- name: Check whether node is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Create kubeadm join command on master
  ansible.builtin.command:
    argv:
      - kubeadm
      - token
      - create
      - --print-join-command
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  register: kubeadm_join_raw
  changed_when: true

- name: Build kubeadm join argv
  ansible.builtin.set_fact:
    kubeadm_join_argv: >-
      {{
        (hostvars[ansible_play_hosts[0]].kubeadm_join_raw.stdout | trim).split()
        + (
            ['--ignore-preflight-errors=' + (kubeadm_ignore_preflight_errors | join(','))]
            if (kubeadm_ignore_preflight_errors | default([]) | length) > 0
            else []
          )
      }}
  when: not kubelet_conf.stat.exists

- name: Join worker to the cluster
  ansible.builtin.command:
    argv: "{{ kubeadm_join_argv }}"
  when: not kubelet_conf.stat.exists
  register: kubeadm_join
  changed_when: kubeadm_join.rc == 0
