---
# DESTRUCTIVE: kubeadm reset on all nodes
- name: Reset Kubernetes cluster
  hosts: all
  become: true
  gather_facts: false
  serial: 1
  tasks:
    - name: kubeadm reset
      ansible.builtin.command: kubeadm reset -f
      failed_when: false
      changed_when: true

    - name: Remove CNI and kube config leftovers
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/cni/net.d
        - /var/lib/cni
        - /var/lib/kubelet
        - /etc/kubernetes

    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted
