---
# Shared variables for all nodes
timezone: Europe/Prague

# Kubernetes
k8s_version: "1.35.6"
k8s_version_short: "v1.35"
pod_network_cidr: "10.244.0.0/16"

# containerd
containerd_config_path: /etc/containerd/config.toml

# Where to store admin kubeconfig on the control machine
kubeconfig_local_path: "{{ playbook_dir }}/../../kubeconfig/admin.conf"

# CNI
cni_provider: cilium
cilium_version: "1.16.5"
